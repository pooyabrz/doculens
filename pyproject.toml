[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doculens-qa"
version = "0.1.0"
description = "A Python-first document Q&A prototype with inspectable evidence"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["streamlit==1.65.0", "pypdf==6.20.1"]

[tool.setuptools.packages.find]
include = ["doculens*"]
